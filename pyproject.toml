[project]
name = "apexodds"
version = "0.1.0"
description = "Telemetry-driven live F1 race simulator and probability engine (Phase 0: backtest + calibration)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "matplotlib>=3.8",
    "tabulate>=0.9",  # pandas.to_markdown (reports)
]

[project.optional-dependencies]
# FastF1 is heavy (requests-cache, rapidfuzz, ...) — only needed for historical ETL.
etl = ["fastf1>=3.4"]
# Direct Postgres access to Supabase. Core sim/backtest works from parquet without it.
db = ["psycopg[binary]>=3.1"]
# Phase 1 live sources (unofficial clients).
live = ["livef1>=0.1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apexodds"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
